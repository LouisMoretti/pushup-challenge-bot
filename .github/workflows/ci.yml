name: CI

on:
    push:
        branches: [master]
    pull_request:

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Lint (ESLint + Prettier)
              run: npx eslint .

            - name: Security audit (production deps)
              run: npm audit --omit=dev
